name: CI

on:
  push:
  pull_request:

# The adapters' no-credentials path is only exercised if none of these are set.
# Kept in one place so a new adapter credential is added once, not per job.
env:
  ADAPTER_CRED_VARS: >-
    AMADEUS_API_KEY AMADEUS_API_SECRET
    STAYS_API_URL STAYS_API_KEY
    PACKAGES_API_URL PACKAGES_API_KEY

jobs:
  lint-and-guards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint skills and commands
        run: uv run python tools/lint_skills.py

      - name: Run security guards
        run: uv run python tools/security_guards.py

  clone-symlink-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Prove the .claude/commands and .claude/skills symlinks survive an
      # actual `git clone` round trip (not merely that they exist in the
      # working tree checked out by actions/checkout), since that's exactly
      # what protects clone mode from silently regressing into duplicated
      # files for anyone who forks/clones the repo.
      - name: Clone the checkout and verify symlinks
        run: |
          set -e
          git clone "$PWD" /tmp/clone-test
          for link in .claude/commands .claude/skills; do
            if [ ! -L "/tmp/clone-test/$link" ]; then
              echo "FAILED: $link is not a symlink after clone"
              exit 1
            fi
          done
          test "$(readlink /tmp/clone-test/.claude/commands)" = "../commands"
          test "$(readlink /tmp/clone-test/.claude/skills)" = "../skills"
          test -f /tmp/clone-test/.claude/commands/plan.md
          test -f /tmp/clone-test/.claude/skills/holiday-planner/SKILL.md
          echo "OK: symlinks resolved correctly after clone"

  adapter-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # `uv run --python X` downloads X on demand and exits non-zero if it
      # cannot honor the request, so it needs no separate install step and
      # cannot silently fall back to the .python-version pin.
      - name: Smoke-test search adapters --help (no credentials in environment)
        run: |
          set -e
          for v in $ADAPTER_CRED_VARS; do unset "$v"; done
          for f in .agents/skills/*/search.py; do
            echo "Running: $f --help"
            uv run --python ${{ matrix.python-version }} "$f" --help
          done

  standalone-adapter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Every adapter must survive the documented copy-a-folder fork workflow,
      # so copy each one out of the checkout in turn — a broken PEP 723 header
      # in any single adapter has to fail this job.
      - name: Run each adapter standalone outside the repo (PEP 723 metadata)
        run: |
          set -e
          for v in $ADAPTER_CRED_VARS; do unset "$v"; done
          repo="$PWD"
          for f in "$repo"/.agents/skills/*/search.py; do
            adapter="$(basename "$(dirname "$f")")"
            tmp_dir="$(mktemp -d)"
            cp -r "$(dirname "$f")"/. "$tmp_dir"/
            echo "Running $adapter standalone in $tmp_dir"
            (cd "$tmp_dir" && uv run search.py --help >/dev/null)
            rm -rf "$tmp_dir"
          done
