name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-guards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint skills and commands
        run: uv run python tools/lint_skills.py

      - name: Run security guards
        run: uv run python tools/security_guards.py

      # Re-run both linters against a real `git clone` rather than the working
      # tree actions/checkout produced. That round trip is the only place the
      # assertions that depend on what git actually records — symlink text and
      # dangling-ness, tracked-file and .gitignore coverage — are tested
      # against a checkout a user would get.
      - name: Clone the checkout and re-run both linters inside it
        run: |
          set -e
          git clone "$PWD" /tmp/clone-test
          cd /tmp/clone-test
          uv sync
          uv run python tools/lint_skills.py
          uv run python tools/security_guards.py

  adapter-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # tools/_repo.py's ADAPTER_CRED_VARS is the single source of truth for
      # this list — derive it here instead of hardcoding it a second time,
      # so a new adapter credential is added once, not per job/file.
      - name: Load adapter credential var list
        run: |
          vars="$(cd tools && uv run python -c "from _repo import ADAPTER_CRED_VARS; print(' '.join(ADAPTER_CRED_VARS))")"
          echo "ADAPTER_CRED_VARS=$vars" >> "$GITHUB_ENV"

      # `uv run --python X` downloads X on demand and exits non-zero if it
      # cannot honor the request, so it needs no separate install step and
      # cannot silently fall back to the .python-version pin.
      - name: Smoke-test search adapters --help (no credentials in environment)
        run: |
          set -e
          for v in $ADAPTER_CRED_VARS; do unset "$v"; done
          for f in .agents/skills/*/search.py; do
            echo "Running: $f --help"
            uv run --python ${{ matrix.python-version }} "$f" --help
          done

  standalone-adapter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Load adapter credential var list
        run: |
          vars="$(cd tools && uv run python -c "from _repo import ADAPTER_CRED_VARS; print(' '.join(ADAPTER_CRED_VARS))")"
          echo "ADAPTER_CRED_VARS=$vars" >> "$GITHUB_ENV"

      # Every adapter must survive the documented copy-a-folder fork workflow,
      # so copy each one out of the checkout in turn — a broken PEP 723 header
      # in any single adapter has to fail this job.
      - name: Run each adapter standalone outside the repo (PEP 723 metadata)
        run: |
          set -e
          for v in $ADAPTER_CRED_VARS; do unset "$v"; done
          repo="$PWD"
          for f in "$repo"/.agents/skills/*/search.py; do
            adapter="$(basename "$(dirname "$f")")"
            tmp_dir="$(mktemp -d)"
            cp -r "$(dirname "$f")"/. "$tmp_dir"/
            echo "Running $adapter standalone in $tmp_dir"
            (cd "$tmp_dir" && uv run search.py --help >/dev/null)
            rm -rf "$tmp_dir"
          done
